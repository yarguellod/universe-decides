<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ The Universe Decides</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #07060f;
    --deep: #0e0b1e;
    --nebula: #1a1535;
    --mist: #2a2250;
    --glow-violet: #8b5cf6;
    --glow-indigo: #6366f1;
    --glow-rose: #e879a0;
    --glow-amber: #f59e0b;
    --glow-teal: #2dd4bf;
    --star: #e2d9f3;
    --dim: #9b8ec4;
    --font-display: 'Cinzel Decorative', serif;
    --font-body: 'Raleway', sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--void);
    color: var(--star);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  /* starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 5%,  rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* nebula glow orbs */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99,60,180,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 500px 300px at 80% 70%, rgba(232,121,160,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 400px 400px at 50% 10%, rgba(45,212,191,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: auto 1fr;
    gap: 0;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
  }

  header {
    grid-column: 1 / -1;
    text-align: center;
    padding: 2rem 0 2.5rem;
    position: relative;
  }

  .sigil {
    display: block;
    font-size: 2rem;
    letter-spacing: 0.5rem;
    color: var(--glow-violet);
    opacity: 0.7;
    margin-bottom: 0.5rem;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 400;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--star) 0%, var(--glow-violet) 50%, var(--glow-rose) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* WHEEL AREA */
  .wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1rem 2rem 2rem;
  }

  .wheel-wrap {
    position: relative;
    width: min(360px, 90vw);
    height: min(360px, 90vw);
  }

  /* outer ring glow */
  .wheel-wrap::before {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--glow-violet), var(--glow-rose), var(--glow-teal), var(--glow-indigo), var(--glow-violet));
    opacity: 0.25;
    filter: blur(8px);
    transition: opacity 0.3s;
  }

  .wheel-wrap.spinning::before {
    opacity: 0.6;
    animation: ring-spin 1s linear infinite;
  }

  @keyframes ring-spin {
    to { transform: rotate(360deg); }
  }

  canvas#wheel, .center-orb {
    touch-action: manipulation;
  }

  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    cursor: pointer;
    filter: drop-shadow(0 0 20px rgba(139,92,246,0.3));
    transition: filter 0.3s;
  }

  canvas#wheel:hover {
    filter: drop-shadow(0 0 30px rgba(139,92,246,0.5));
  }

  /* pointer / needle */
  .needle {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 28px solid var(--glow-rose);
    filter: drop-shadow(0 0 6px var(--glow-rose));
    z-index: 2;
  }

  .needle::after {
    content: '';
    position: absolute;
    top: -36px;
    left: -6px;
    width: 12px;
    height: 12px;
    background: var(--glow-rose);
    border-radius: 50%;
    filter: blur(2px);
  }

  /* center orb */
  .center-orb {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow-violet) 0%, var(--deep) 70%);
    border: 2px solid rgba(139,92,246,0.5);
    z-index: 3;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 16px rgba(139,92,246,0.4);
  }

  .center-orb:hover {
    transform: translate(-50%, -50%) scale(1.15);
    box-shadow: 0 0 28px rgba(139,92,246,0.7);
  }

  /* spin button */
  .spin-btn {
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    padding: 0.85rem 2.5rem;
    background: transparent;
    border: 1px solid rgba(139,92,246,0.5);
    color: var(--star);
    border-radius: 100px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .spin-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(232,121,160,0.1));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .spin-btn:hover::before { opacity: 1; }
  .spin-btn:hover {
    border-color: var(--glow-violet);
    box-shadow: 0 0 20px rgba(139,92,246,0.3);
  }

  .spin-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* result */
  .result-display {
    min-height: 3rem;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--glow-violet);
    letter-spacing: 0.05em;
    transition: opacity 0.4s, transform 0.4s;
    opacity: 0;
    transform: translateY(6px);
  }

  .result-display.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .result-glyph {
    font-size: 0.9rem;
    color: var(--dim);
    margin-top: 0.25rem;
    font-weight: 300;
    letter-spacing: 0.2em;
  }

  /* SIDEBAR */
  .sidebar {
    border-left: 1px solid rgba(139,92,246,0.15);
    padding: 1rem 0 2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(139,92,246,0.2);
  }

  /* mode toggle */
  .mode-toggle {
    display: flex;
    gap: 0;
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 8px;
    overflow: hidden;
  }

  .mode-btn {
    flex: 1;
    padding: 0.5rem 0.75rem;
    background: transparent;
    border: none;
    color: var(--dim);
    font-family: var(--font-body);
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.05em;
  }

  .mode-btn.active {
    background: rgba(139,92,246,0.2);
    color: var(--star);
  }

  /* options list */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-height: 260px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(139,92,246,0.3) transparent;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: rgba(26,21,53,0.6);
    border: 1px solid rgba(139,92,246,0.15);
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--star);
    transition: border-color 0.2s;
    animation: slide-in 0.2s ease;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .option-item:hover {
    border-color: rgba(139,92,246,0.4);
  }

  .option-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .option-text {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-remove {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .option-remove:hover { color: var(--glow-rose); }

  /* add input */
  .add-row {
    display: flex;
    gap: 0.5rem;
  }

  .add-input {
    flex: 1;
    background: rgba(14,11,30,0.8);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    color: var(--star);
    font-family: var(--font-body);
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-input:focus {
    border-color: rgba(139,92,246,0.6);
  }

  .add-input::placeholder { color: var(--dim); }

  .add-btn {
    background: rgba(139,92,246,0.2);
    border: 1px solid rgba(139,92,246,0.4);
    border-radius: 8px;
    color: var(--star);
    padding: 0.5rem 0.8rem;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s;
  }

  .add-btn:hover {
    background: rgba(139,92,246,0.35);
  }

  .empty-state {
    font-size: 0.75rem;
    color: var(--dim);
    text-align: center;
    padding: 1rem;
    font-style: italic;
    font-weight: 300;
  }

  /* history */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    max-height: 140px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(139,92,246,0.3) transparent;
  }

  .history-item {
    font-size: 0.72rem;
    color: var(--dim);
    padding: 0.3rem 0.5rem;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid rgba(139,92,246,0.08);
  }

  .history-item .result-word {
    color: var(--star);
    font-weight: 500;
  }

  .clear-btn {
    background: none;
    border: none;
    color: var(--dim);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    align-self: flex-end;
    transition: color 0.2s;
    font-family: var(--font-body);
  }

  .clear-btn:hover { color: var(--glow-rose); }

  /* responsive */
  @media (max-width: 720px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      padding: 1rem 0.75rem;
      gap: 0;
    }
    header { padding: 1.25rem 0 1.5rem; }
    h1 { font-size: clamp(1.1rem, 5vw, 1.6rem); }
    .subtitle { font-size: 0.65rem; letter-spacing: 0.2em; }
    .wheel-area { padding: 0.5rem 0.5rem 1.5rem; gap: 1.25rem; }
    .wheel-wrap { width: min(300px, 85vw); height: min(300px, 85vw); }
    .spin-btn { font-size: 0.65rem; padding: 0.75rem 1.75rem; letter-spacing: 0.1em; }
    .result-display { font-size: 1.15rem; }
    .sidebar {
      border-left: none;
      border-top: 1px solid rgba(139,92,246,0.15);
      padding: 1.5rem 0.25rem 2rem;
    }
    .options-list { max-height: 180px; }
    .history-list { max-height: 110px; }
    .mode-btn { padding: 0.55rem 0.5rem; font-size: 0.7rem; }
  }

  @media (max-width: 380px) {
    .wheel-wrap { width: 90vw; height: 90vw; }
    h1 { font-size: 1rem; }
    .spin-btn { font-size: 0.6rem; padding: 0.65rem 1.25rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="sigil">✦ ✧ ✦</span>
    <h1>The Universe Decides</h1>
    <p class="subtitle">surrender to the cosmic wheel</p>
  </header>

  <main class="wheel-area">
    <div class="wheel-wrap" id="wheelWrap">
      <div class="needle"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
      <div class="center-orb" id="centerOrb" title="spin">✦</div>
    </div>
    <button class="spin-btn" id="spinBtn">✦ &nbsp; CONSULT THE COSMOS &nbsp; ✦</button>
    <div class="result-display" id="resultDisplay">
      <div id="resultText"></div>
      <div class="result-glyph" id="resultGlyph"></div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Mode</div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeYesNo" onclick="setMode('yesno')">Yes / No</button>
        <button class="mode-btn" id="modeCustom" onclick="setMode('custom')">Custom</button>
      </div>
    </div>

    <div class="sidebar-section" id="customSection" style="display:none">
      <div class="section-label">Options</div>
      <div class="options-list" id="optionsList"></div>
      <div class="add-row">
        <input class="add-input" id="addInput" placeholder="add an option…" maxlength="40">
        <button class="add-btn" onclick="addOption()" title="add">+</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Recent readings</div>
      <div class="history-list" id="historyList">
        <div class="empty-state">no readings yet</div>
      </div>
      <button class="clear-btn" onclick="clearHistory()">clear history</button>
    </div>
  </aside>
</div>

<script>
const STORAGE_KEY = 'cosmic_wheel_v1';

const COLORS = [
  ['#5b21b6','#7c3aed'],
  ['#be185d','#e879a0'],
  ['#0f766e','#2dd4bf'],
  ['#1d4ed8','#6366f1'],
  ['#92400e','#f59e0b'],
  ['#065f46','#34d399'],
  ['#7e22ce','#a78bfa'],
  ['#9d174d','#f472b6'],
];

const YES_NO = [
  'Yes', 'No',
  'Absolutely', 'No way',
  'Definitely', 'Not a chance',
  'The stars say yes', 'The void says no',
  'Without a doubt', 'Hard no',
];

let state = {
  mode: 'yesno',
  customOptions: ['Maybe', 'Definitely', 'Not now', 'Ask again'],
  history: [],
};

let spinning = false;
let currentAngle = 0;

function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = { ...state, ...JSON.parse(s) };
  } catch(e) {}
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function padToMin(arr, min) {
  min = min || 10;
  if (arr.length >= min) return arr;
  var out = [];
  var round = 0;
  while (out.length < min) {
    arr.forEach(function(item) { out.push({ label: item, round: round }); });
    round++;
  }
  return out.slice(0, Math.max(min, arr.length));
}

function getOptions() {
  var base = state.mode === 'yesno' ? YES_NO : state.customOptions;
  var padded = padToMin(base);
  var labels = padded.map(function(x) { return x.label !== undefined ? x.label : x; });
  var colorIdxs = padded.map(function(x, i) {
    if (x.round !== undefined) {
      var baseIdx = base.indexOf(x.label);
      return (baseIdx + x.round * Math.ceil(COLORS.length / base.length)) % COLORS.length;
    }
    return i % COLORS.length;
  });
  return { labels: labels, colorIdxs: colorIdxs };
}

function setMode(m) {
  state.mode = m;
  document.getElementById('modeYesNo').classList.toggle('active', m === 'yesno');
  document.getElementById('modeCustom').classList.toggle('active', m === 'custom');
  document.getElementById('customSection').style.display = m === 'custom' ? 'flex' : 'none';
  save();
  renderWheel();
  renderOptions();
}

function addOption() {
  const input = document.getElementById('addInput');
  const val = input.value.trim();
  if (!val) return;
  if (state.customOptions.length >= 12) { input.value = ''; return; }
  state.customOptions.push(val);
  input.value = '';
  save();
  renderWheel();
  renderOptions();
}

function removeOption(i) {
  state.customOptions.splice(i, 1);
  if (state.customOptions.length === 0) state.customOptions = ['Add options above'];
  save();
  renderWheel();
  renderOptions();
}

function renderOptions() {
  const list = document.getElementById('optionsList');
  if (state.customOptions.length === 0) {
    list.innerHTML = '<div class="empty-state">add options to begin</div>';
    return;
  }
  list.innerHTML = state.customOptions.map((o, i) => {
    const c = COLORS[i % COLORS.length][1];
    return `<div class="option-item">
      <div class="option-dot" style="background:${c}"></div>
      <span class="option-text">${escHtml(o)}</span>
      <button class="option-remove" onclick="removeOption(${i})" title="remove">×</button>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderWheel() {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const { labels: opts, colorIdxs } = getOptions();
  const n = opts.length;
  const cx = 250, cy = 250, r = 240;
  const arc = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, 500, 500);

  // outer shadow ring
  ctx.save();
  ctx.shadowColor = 'rgba(139,92,246,0.4)';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(139,92,246,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  for (let i = 0; i < n; i++) {
    const start = currentAngle + i * arc - Math.PI / 2;
    const end = start + arc;
    const [dark, light] = COLORS[colorIdxs[i]];

    // fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();

    const gx = cx + Math.cos((start + end) / 2) * r * 0.5;
    const gy = cy + Math.sin((start + end) / 2) * r * 0.5;
    const grad = ctx.createRadialGradient(cx, cy, 0, gx, gy, r);
    grad.addColorStop(0, dark + 'dd');
    grad.addColorStop(1, light + 'aa');
    ctx.fillStyle = grad;
    ctx.fill();

    // border
    ctx.strokeStyle = 'rgba(7,6,15,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((start + end) / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f0ebff';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    const fs = n <= 4 ? 18 : n <= 8 ? 15 : 12;
    ctx.font = `500 ${fs}px 'Raleway', sans-serif`;
    ctx.fillText(opts[i], r - 18, fs / 3);
    ctx.restore();
  }

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
  cg.addColorStop(0, '#5b21b6');
  cg.addColorStop(1, '#07060f');
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,92,246,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function spin() {
  if (spinning) return;
  const { labels: opts } = getOptions();
  if (opts.length === 0) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('wheelWrap').classList.add('spinning');
  document.getElementById('resultDisplay').classList.remove('visible');

  const totalRotation = (Math.PI * 2) * (5 + Math.random() * 5);
  const duration = 3500 + Math.random() * 1500;
  const start = performance.now();
  const startAngle = currentAngle;

  function ease(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function frame(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalRotation * ease(t);
    renderWheel();

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('wheelWrap').classList.remove('spinning');

      const arc = (2 * Math.PI) / opts.length;
      // Segments are drawn starting at (currentAngle - π/2) for segment 0.
      // Needle is fixed at the top (−π/2). Find which segment the top falls into.
      const offset = (((-currentAngle) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const idx = Math.floor(offset / arc) % opts.length;
      showResult(opts[idx]);
    }
  }

  requestAnimationFrame(frame);
}

const GLYPHS = [
  'the cosmos has spoken',
  'written in the stars',
  'so it is, so it shall be',
  'the universe whispers',
  'destiny revealed',
  'trust the signal',
  'the void has answered',
];

function showResult(text) {
  const el = document.getElementById('resultDisplay');
  document.getElementById('resultText').textContent = text;
  document.getElementById('resultGlyph').textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  el.classList.add('visible');
  addHistory(text);
}

function addHistory(text) {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  state.history.unshift({ text, time });
  if (state.history.length > 20) state.history.pop();
  save();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (state.history.length === 0) {
    el.innerHTML = '<div class="empty-state">no readings yet</div>';
    return;
  }
  el.innerHTML = state.history.map(h =>
    `<div class="history-item"><span class="result-word">${escHtml(h.text)}</span><span>${h.time}</span></div>`
  ).join('');
}

function clearHistory() {
  state.history = [];
  save();
  renderHistory();
}

// keyboard
document.getElementById('addInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addOption();
});

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('centerOrb').addEventListener('click', spin);
document.getElementById('wheel').addEventListener('click', spin);

// init
load();
setMode(state.mode);
renderWheel();
renderHistory();
</script>
